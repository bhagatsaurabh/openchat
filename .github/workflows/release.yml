name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        run: |
          npm i
          npm run build
        env:
          VITE_OPENCHAT_PUBLIC_KEY: ${{ secrets.VITE_OPENCHAT_PUBLIC_KEY }}

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openchat-dist
          path: dist

  Deploy-Firebase:
    needs: [Build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download dist artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: openchat-dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0.11.0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENCHAT_A5CEC }}"
          channelId: live
          projectId: openchat-a5cec

  Cleanup:
    needs: [Deploy-Firebase]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete dist artifacts
        uses: GeekyEggo/delete-artifact@v6.0.0
        with:
          name: openchat-dist
          failOnError: false
